name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # Runs the README quickstart commands on both platforms, plus lint and coverage.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        # Some test modules fail to import without the extras (scipy first).
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: CLI starts
        run: uv run pantrychef --help

      - name: Golden file is current
        # The test above checks the same thing. This step shows the diff when it fails.
        if: runner.os == 'Linux'
        run: |
          uv run python scripts/make_golden.py
          git diff --exit-code -- tests/golden

  audit:
    # A reviewed exception needs an --ignore-vuln flag and a comment here with the reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Audit locked dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project -o audit-requirements.txt
          # Python 3.11 matches CI, so environment markers select the packages that really run.
          uvx --python 3.11 pip-audit==2.10.1 -r audit-requirements.txt --no-deps --disable-pip

  web:
    # TypeScript engine and UI: audit, type check, parity and rule tests.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Playwright smoke test on the synthetic fixture pack. No real recipe text is used.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
