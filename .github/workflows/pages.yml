name: Deploy to Pages

# Manual only. The owner runs this after the pack is uploaded to the GitHub Release `pack-v1`
# and web/pack-hashes.json holds that pack's hashes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download the pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download pack-v1 --pattern '*.json.gz' --dir web/public/pack

      - name: Verify the pack hashes
        working-directory: web
        run: node scripts/verify-pack.mjs

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
